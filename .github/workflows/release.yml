# Builds Spoor for Windows, macOS, Linux and Android.
# - Run it by hand (Actions → Build apps → Run workflow) to get the files as workflow artifacts.
# - Push a tag like v0.2.0 to also publish them as a GitHub Release.
# No API key is ever built in: each app reads the user's own settings file at runtime.
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # tag v1.2.3 → 1.2.3; manual runs use package.json's version
  APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, args: --win }
          - { name: macos, os: macos-latest, args: --mac }
          - { name: linux, os: ubuntu-24.04, args: --linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Set version from tag
        if: env.APP_VERSION != ''
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${APP_VERSION#v}"
      - run: npm ci
      - run: npm test
      - run: npm ci
        working-directory: web
      - run: npm run web:build
      - name: Package
        shell: bash
        env:
          # unsigned builds; add signing secrets later if you want to remove the OS warnings
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: spoor-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.AppImage

  android:
    name: Android
    runs-on: ubuntu-24.04
    env:
      HAS_KEYSTORE: ${{ secrets.WB_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - run: npm ci
      - run: npm test
      - run: npm ci
        working-directory: web
      - run: npm run web:build
      - run: npm ci
        working-directory: mobile
      - name: Bundle engine and sync Capacitor
        run: npm run sync
        working-directory: mobile
      - name: Version
        shell: bash
        run: |
          v="${APP_VERSION#v}"; [ -n "$v" ] || v="$(node -p "require('./package.json').version")"
          echo "WB_VERSION_NAME=$v" >> "$GITHUB_ENV"
          echo "WB_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Build debug APK (installable, debug-signed)
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Build signed release APK
        # only when the four secrets exist: WB_KEYSTORE_BASE64, WB_KEYSTORE_PASSWORD, WB_KEY_ALIAS, WB_KEY_PASSWORD
        env:
          WB_KEYSTORE_BASE64: ${{ secrets.WB_KEYSTORE_BASE64 }}
          WB_KEYSTORE_PASSWORD: ${{ secrets.WB_KEYSTORE_PASSWORD }}
          WB_KEY_ALIAS: ${{ secrets.WB_KEY_ALIAS }}
          WB_KEY_PASSWORD: ${{ secrets.WB_KEY_PASSWORD }}
        if: env.HAS_KEYSTORE == 'true'
        working-directory: mobile/android
        shell: bash
        run: |
          echo "$WB_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          WB_KEYSTORE="$RUNNER_TEMP/release.keystore" ./gradlew --no-daemon assembleRelease
      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "out/Spoor-${WB_VERSION_NAME}-android-debug.apk"
          if [ -f mobile/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp mobile/android/app/build/outputs/apk/release/app-release.apk "out/Spoor-${WB_VERSION_NAME}-android.apk"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: spoor-android
          if-no-files-found: error
          path: out/*.apk

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Spoor ${{ github.ref_name }}: a paper trader with a 302-neuron C. elegans brain, on Robinhood Chain. Paper only, not financial advice.

            **Windows**: `Spoor-*-Setup.exe` (installer) or `Spoor-*-Portable.exe`. Unsigned: SmartScreen may ask you to click "More info → Run anyway".
            **macOS**: `Spoor-*-mac-arm64.dmg` (Apple Silicon) or `-mac-x64.dmg` (Intel). Unsigned: right-click the app → Open the first time.
            **Linux**: `Spoor-*.AppImage` (chmod +x, then run).
            **Android**: `Spoor-*-android*.apk`. Allow installs from your browser/files app. The engine runs on the phone while the app is open.

            Optional: put an Anthropic API key in the app's settings file to enable the draft posts and the lab notebook (desktop: Spoor → Edit settings).
