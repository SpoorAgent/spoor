<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Spoor</title>
  <style>
    /* same look as the site: black canvas, hairline borders, white type, one violet */
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; }
    body { background: #000; color: #a1a4a5; font: 400 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
    .mark { width: 112px; height: 70px; color: #fff; animation: turn 3.2s ease-in-out infinite; }
    @keyframes turn { 50% { transform: rotateY(180deg); } }
    @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
    h1 { font: 400 40px/1 "Bodoni Moda", "Didot", Georgia, serif; color: #fff; margin: 24px 0 10px; letter-spacing: -.01em; }
    #msg { min-height: 1.5em; font: 400 13px/1.5 "JetBrains Mono", ui-monospace, monospace; color: #baa7ff; }
    #err { margin: 16px auto 0; max-width: 34em; max-height: 40vh; overflow: auto; text-align: left; font: 12px/1.5 ui-monospace, monospace; color: #ff9592;
      background: #000; border: 1px solid #292d30; border-radius: 16px; padding: 14px; white-space: pre-wrap; }
    small { display: block; margin-top: 28px; color: #6e727a; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 32 20" aria-hidden="true"><circle cx="10" cy="10" r="8.2" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="20" cy="10" r="8.2" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
    <h1>Spoor</h1>
    <p id="msg" role="status">Waking 302 neurons…</p>
    <pre id="err" hidden></pre>
    <small>Paper trading only. Not financial advice.</small>
  </main>
  <script type="module" src="boot.js"></script>
</body>
</html>
